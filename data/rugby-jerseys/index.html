<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fantasy Rugby - Team Shirts</title>
<style>
  :root { box-sizing:border-box; --bg:#eef1f4; --card:#fff; --ink:#0f1720; --muted:#5b6672; }
  * { box-sizing:inherit; }
  body { margin:0; padding:28px 16px 48px; background:var(--bg); color:var(--ink); font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  header { max-width:760px; margin:0 auto 22px; }
  h1 { font-size:1.35rem; margin:0 0 4px; letter-spacing:-0.01em; }
  p.sub { margin:0; color:var(--muted); font-size:0.9rem; }
  .grid { max-width:760px; margin:0 auto; display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:14px; }
  .card { margin:0; background:var(--card); border-radius:14px; padding:16px 10px 12px; box-shadow:0 1px 2px rgba(16,24,32,.08); text-align:center; }
  .shirt { height:96px; display:flex; align-items:center; justify-content:center; }
  .shirt svg { height:100%; width:auto; filter:drop-shadow(0 2px 3px rgba(0,0,0,.12)); }
  figcaption { margin-top:8px; font-size:0.8rem; font-weight:600; }
</style></head>
