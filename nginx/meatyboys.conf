# Meaty Boys — nginx reverse proxy.
# Installed to /etc/nginx/sites-available/meatyboys by deploy.sh.
# The __APP_PORT__ placeholder is substituted at deploy time from .env's PORT.

server {
    listen 80;
    listen [::]:80;
    server_name _;   # set to your domain, e.g. meatyboys.com www.meatyboys.com

    location / {
        proxy_pass http://127.0.0.1:__APP_PORT__;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    client_max_body_size 4M;
    access_log /var/log/nginx/meatyboys.access.log;
    error_log  /var/log/nginx/meatyboys.error.log;
}
